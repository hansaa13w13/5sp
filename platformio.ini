; ─── Varsayılan ortam — yalnızca bu yüklenir (pio run / pio run -t upload) ───
[platformio]
default_envs = bw16

; ─── Ortak ayarlar ────────────────────────────────────────────────────────────
[common]
build_flags_base =
  -O2
  -fno-exceptions
  -fno-rtti
  -DCORE_DEBUG_LEVEL=0

; ─── ESP32 DOIT DevKit — 240 MHz ──────────────────────────────────────────────
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
  ${common.build_flags_base}
monitor_speed = 115200
upload_speed  = 921600

; ─── ESP32-S3 DevKit — 240 MHz ────────────────────────────────────────────────
[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
  ${common.build_flags_base}
monitor_speed = 115200
upload_speed  = 921600

; ─── BW16-KIT RTL8720DN — birincil hedef — 2.4GHz + 5GHz ────────────────────
; Çift bantlı WiFi: 2.4 GHz (802.11b/g/n) + 5 GHz (802.11a/n/ac)
; Ameba Arduino SDK kullanır — ESP-IDF değil
[env:bw16]
platform = https://github.com/ambiot/ambd_arduino.git
board = bw16
framework = arduino
build_flags =
  -O2
  -fno-exceptions
  -fno-rtti
  -DBOARD_BW16
  -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
upload_speed  = 1000000
